<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Udemy Subtitle Translate</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header class="header">
    <div class="header-icon" aria-hidden="true">🎓</div>
    <div class="header-text">
      <h1>Subtitle Translate</h1>
      <p>udemy.com</p>
    </div>
    <div class="header-toggle">
      <label class="toggle" title="Zapnout / vypnout překlad">
        <input type="checkbox" id="enabled" aria-label="Zapnout překlad" />
        <span class="toggle-track"></span>
        <span class="toggle-thumb"></span>
      </label>
    </div>
  </header>

  <main class="form">
    <fieldset class="field">
      <legend class="field-label">Zobrazení titulků</legend>
      <div class="segmented" role="radiogroup">
        <input type="radio" name="displayMode" id="modeBoth" value="both" />
        <label for="modeBoth">Originál + překlad</label>
        <input type="radio" name="displayMode" id="modeTranslation" value="translation" />
        <label for="modeTranslation">Pouze překlad</label>
      </div>
    </fieldset>

    <div class="field">
      <label class="field-label" for="lang">Přeložit do</label>
      <select id="lang"></select>
    </div>

    <div class="field">
      <label class="field-label" for="sourceLang">Zdrojový jazyk</label>
      <select id="sourceLang"></select>
    </div>

    <div class="field">
      <label class="field-label" for="fontSize">Velikost titulků</label>
      <div class="range-row">
        <input type="range" id="fontSize" step="5" />
        <output class="range-val" id="fontSizeVal" for="fontSize"></output>
      </div>
    </div>

    <div class="field">
      <div class="field-head">
        <label class="field-label" for="verticalOffset">Svislá pozice</label>
        <button type="button" class="link-btn" id="resetOffset">Výchozí</button>
      </div>
      <div class="range-row">
        <span class="range-hint" aria-hidden="true">dolů</span>
        <input type="range" id="verticalOffset" />
        <span class="range-hint" aria-hidden="true">nahoru</span>
        <output class="range-val" id="verticalOffsetVal" for="verticalOffset"></output>
      </div>
    </div>

    <fieldset class="field">
      <legend class="field-label">Synchronizace</legend>
      <div class="segmented" role="radiogroup">
        <input type="radio" name="syncMode" id="syncVideo" value="video" />
        <label for="syncVideo" title="Vlastní časování podle videa – lze posunout v čase">Podle videa</label>
        <input type="radio" name="syncMode" id="syncUdemy" value="udemy" />
        <label for="syncUdemy" title="Zobrazuje se, když titulek ukáže Udemy (respektuje CC a jeho pozici)">Podle Udemy</label>
      </div>
    </fieldset>

    <div class="field" id="timingField">
      <div class="field-head">
        <label class="field-label" for="timingOffset">Časování</label>
        <button type="button" class="link-btn" id="resetTiming">Výchozí</button>
      </div>
      <div class="range-row">
        <span class="range-hint" aria-hidden="true">dříve</span>
        <input type="range" id="timingOffset" />
        <span class="range-hint" aria-hidden="true">později</span>
        <output class="range-val" id="timingOffsetVal" for="timingOffset"></output>
      </div>
      <p class="field-note" id="timingNote" hidden>Časování lze posunout jen v režimu „Podle videa“.</p>
    </div>

    <details class="section">
      <summary class="field-label">Vzhled</summary>
      <div class="section-body">
        <div class="color-row">
          <label for="textColor">Překlad</label>
          <input type="color" id="textColor" />
        </div>
        <div class="color-row">
          <label for="originalColor">Originál</label>
          <input type="color" id="originalColor" />
        </div>
        <div class="color-row">
          <label for="bgColor">Pozadí</label>
          <input type="color" id="bgColor" />
        </div>
        <div class="range-row">
          <label class="range-hint" for="bgOpacity">průhlednost pozadí</label>
          <input type="range" id="bgOpacity" min="0" max="100" step="5" />
          <output class="range-val" id="bgOpacityVal" for="bgOpacity"></output>
        </div>
        <button type="button" class="link-btn" id="resetAppearance">Výchozí vzhled</button>
      </div>
    </details>

    <details class="section">
      <summary class="field-label">Titulky lekce</summary>
      <div class="section-body">
        <div class="button-row">
          <button type="button" class="btn" data-export="srt">Stáhnout SRT</button>
          <button type="button" class="btn" data-export="txt">Stáhnout TXT</button>
        </div>
        <p class="field-note" id="exportNote">Originál + překlad aktuální lekce.</p>
      </div>
    </details>

    <div class="shortcuts" id="shortcuts"></div>
  </main>

  <div class="status" role="status">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Načítám stav…</span>
  </div>

  <footer class="footer">
    <label class="debug-toggle">
      <input type="checkbox" id="debug" />
      Ladicí výpis do konzole
    </label>
    Překlad: Google Translate (gtx endpoint).<br>
    Neoficiální API – bez záruky dostupnosti.
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
